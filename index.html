<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>darkzin-repo</title>
    <link rel="icon" href="https://github.com/darkzin-dev.png" type="image/png">
    
    <style>
        :root {
            --bg: #09090b;
            --card-bg: #121215;
            --border: #27272a;
            --border-hover: #3f3f46;
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --btn-bg: #18181b;
            --btn-hover: #27272a;
            --selection-bg: #542a9c73; 
        }

        ::selection {
            background-color: var(--selection-bg);
            color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 36px 28px;
            text-align: center;
            max-width: 360px;
            width: 100%;
            transition: border-color 0.2s ease;
        }

        .card:hover {
            border-color: var(--border-hover);
        }

        .avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            filter: grayscale(100%);
            transition: filter 0.3s ease;
        }

        .card:hover .avatar {
            filter: grayscale(0%);
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }

        p {
            color: var(--text-secondary);
            font-size: 13.5px;
            line-height: 1.5;
            margin-bottom: 28px;
            font-weight: 400;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: var(--btn-bg);
            color: var(--text-primary);
            text-decoration: none;
            padding: 12px 18px;
            font-size: 13.5px;
            font-weight: 500;
            border-radius: 10px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent; 
        }

        .btn:hover {
            background-color: var(--btn-hover);
            border-color: var(--border-hover);
            color: #ffffff;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-icon {
            width: 15px;
            height: 15px;
            filter: invert(1);
            opacity: 0.8;
            transition: opacity 0.2s ease;
        }

         .btn-logos {
            width: 20px;
            height: 20px;
            opacity: 0.8;
            position: static;
            transition: opacity 0.2s ease;
            align-items: center;
        }

        .btn:hover .btn-icon {
            opacity: 1;
        }

        .toast {
            visibility: hidden;
            background-color: var(--text-primary);
            color: var(--bg);
            text-align: center;
            border-radius: 8px;
            padding: 10px 16px;
            position: fixed;
            bottom: 24px;
            font-size: 12.5px;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
            transform: translateY(10px);
        }

        .toast.show {
            visibility: visible;
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <main class="card">
        <img src="https://github.com/darkzin-dev.png" alt="darkzin avatar" class="avatar">
        
        <h1>darkzin-repo</h1>
        <p>A repository dedicated to publishing my tweaks, and open-source customizations.</p>

        <div class="btn-group">
            <a href="sileo://source/https://darkzin-dev.github.io/darkzin-repo/" class="btn">
                <span><img src="https://i.imgur.com/Ayle79o.png" class="btn-logos"></span> Add to Sileo
            </a>
              <a href="zbra://sources/add/https://darkzin-dev.github.io/darkzin-repo/" class="btn">
                <span><img src="https://getzbra.com/assets/zeeb.svg" class="btn-logos"></span> Add to Zebra
            </a>
            
              <div class="btn-group">
            <a href="cydi://source/https://darkzin-dev.github.io/darkzin-repo/" class="btn">
                <span><img src="https://i.imgur.com/J5MhwCs.png" class="btn-logos"></span> Add to Cydia
            </a>

       
            <button class="btn" onclick="copyRepoURL()">
                <img src="https://cdn-icons-png.flaticon.com/512/1621/1621635.png" alt="Copiar" class="btn-icon">
                Copy URL
            </button>
        </div>
    </main>

    <div id="toast" class="toast">The URL has been copied to the clipboard.</div>

    <script>
        function copyRepoURL() {
            const repoUrl = "https://darkzin-dev.github.io/darkzin-repo/";
            navigator.clipboard.writeText(repoUrl).then(() => {
                const toast = document.getElementById("toast");
                toast.classList.add("show");
                setTimeout(() => {
                    toast.classList.remove("show");
                }, 2000);
            });
        }
    </script>

</body>
</html>
